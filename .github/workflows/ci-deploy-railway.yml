name: CI & Deploy to Railway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Ejecutar despliegue a Railway después de pasar CI (solo aplica en main)"
        type: boolean
        default: false

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contracts:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "./backend[dev]"
      - run: python -m pytest tests/contracts -v

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "./backend[dev]"
      - run: python -m pytest backend/tests -v

  ai:
    name: AI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          pip install -r ai/requirements.txt
      - run: python -m pytest ai/tests -v

  frontend:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_CATALOG_API_BASE_URL: ${{ vars.BACKEND_PUBLIC_URL }}
          NEXT_PUBLIC_ASSISTANT_API_BASE_URL: ${{ vars.AI_PUBLIC_URL }}
          NEXT_PUBLIC_MOCK_MODE: "false"
      - run: npm test

  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [contracts, backend, ai, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: backend/Dockerfile
            build_args: ""
          - service: ai
            dockerfile: ai/Dockerfile
            build_args: ""
          - service: frontend
            dockerfile: frontend/Dockerfile
            build_args: |
              NEXT_PUBLIC_CATALOG_API_BASE_URL=${{ vars.BACKEND_PUBLIC_URL }}
              NEXT_PUBLIC_ASSISTANT_API_BASE_URL=${{ vars.AI_PUBLIC_URL }}
              NEXT_PUBLIC_MOCK_MODE=false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-railway:
    name: Deploy Services to Railway
    runs-on: ubuntu-latest
    needs: [contracts, backend, ai, frontend, docker-build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verificar credenciales Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Falta el secret RAILWAY_TOKEN en GitHub."
            exit 1
          fi
      - name: Instalar Railway CLI
        run: npm install -g @railway/cli@4
      - name: Desplegar backend en Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_BACKEND || 'backend' }}
        run: railway up --service "$SERVICE_NAME" --ci
      - name: Desplegar servicio IA en Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_AI || 'ai' }}
        run: railway up --service "$SERVICE_NAME" --ci
      - name: Desplegar frontend en Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_FRONTEND || 'frontend' }}
        run: railway up --service "$SERVICE_NAME" --ci

  smoke-tests:
    name: Post-Deploy Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-railway]
    if: success()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar smoke tests contra dominios públicos
        env:
          FRONTEND_PUBLIC_URL: ${{ vars.FRONTEND_PUBLIC_URL }}
          BACKEND_PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL }}
          AI_PUBLIC_URL: ${{ vars.AI_PUBLIC_URL }}
        run: python scripts/smoke_test_deploy.py
