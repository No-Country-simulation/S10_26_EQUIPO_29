<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Acelerador de Integraciones Open Source" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060d"/><stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#818cf8"/><stop offset="1" stop-color="#e879f9"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.6 0;0.6 0;-0.6 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="0.5" stop-color="#818cf8"/><stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="round"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <!-- aurora orbs -->
    <circle cx="260" cy="60" r="150" fill="#22d3ee" opacity="0.28" filter="url(#blur)">
      <animate attributeName="cx" values="260;420;260" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="340" r="170" fill="#c026d3" opacity="0.26" filter="url(#blur)">
      <animate attributeName="cy" values="340;240;340" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="40" r="130" fill="#6366f1" opacity="0.30" filter="url(#blur)">
      <animate attributeName="cx" values="760;640;760" dur="14s" repeatCount="indefinite"/>
    </circle>
    <rect width="1280" height="400" fill="url(#grid)"/>

    <!-- status pill -->
    <g transform="translate(80,56)">
      <rect width="470" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <circle cx="20" cy="17" r="5" fill="#22c55e" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="22" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#cbd5e1" letter-spacing="1">NOCOUNTRY  ·  TAREA 1  ·  MANIFIESTO ARQUITECTÓNICO</text>
    </g>

    <!-- title -->
    <text x="78" y="172" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="66" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">Acelerador de Integraciones</text>
    <text x="78" y="248" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="66" font-weight="800" fill="url(#grad)" letter-spacing="-1.5">Open Source</text>
    <rect x="80" y="266" width="140" height="4" rx="2" fill="url(#edge)"><animate attributeName="width" values="40;360;40" dur="6s" repeatCount="indefinite"/></rect>

    <!-- subtitle -->
    <text x="80" y="312" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="21" fill="#94a3b8">Intelligent discovery · Hybrid search · RAG architecture for B2B technology integration</text>
    <g font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
      <g transform="translate(80,336)"><rect width="150" height="30" rx="15" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.5"/><text x="75" y="20" text-anchor="middle">Hybrid Search</text></g>
      <g transform="translate(244,336)"><rect width="110" height="30" rx="15" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.5"/><text x="55" y="20" text-anchor="middle">RRF · k=60</text></g>
      <g transform="translate(368,336)"><rect width="150" height="30" rx="15" fill="#e879f9" fill-opacity="0.12" stroke="#e879f9" stroke-opacity="0.5"/><text x="75" y="20" text-anchor="middle">pgvector · HNSW</text></g>
      <g transform="translate(532,336)"><rect width="190" height="30" rx="15" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.5"/><text x="95" y="20" text-anchor="middle">RAG · Faithfulness</text></g>
    </g>

    <!-- pipeline graphic -->
    <g transform="translate(900,0)" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="middle">
      <g fill="none" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8">
        <path d="M60 120 L170 200" stroke="#22d3ee"><animate attributeName="stroke-dashoffset" values="56;0" dur="2s" repeatCount="indefinite"/></path>
        <path d="M60 280 L170 200" stroke="#818cf8"><animate attributeName="stroke-dashoffset" values="56;0" dur="2s" repeatCount="indefinite"/></path>
        <path d="M170 200 L290 200" stroke="#e879f9"><animate attributeName="stroke-dashoffset" values="56;0" dur="1.6s" repeatCount="indefinite"/></path>
      </g>
      <g filter="url(#glow)">
        <circle cx="60" cy="120" r="34" fill="#0b1020" stroke="#22d3ee" stroke-width="2"/>
        <circle cx="60" cy="280" r="34" fill="#0b1020" stroke="#818cf8" stroke-width="2"/>
        <circle cx="170" cy="200" r="38" fill="#0b1020" stroke="#e879f9" stroke-width="2"/>
        <circle cx="290" cy="200" r="42" fill="#0b1020" stroke="#22c55e" stroke-width="2.5">
          <animate attributeName="r" values="42;46;42" dur="3s" repeatCount="indefinite"/>
        </circle>
      </g>
      <text x="60" y="125">FTS</text>
      <text x="60" y="285">HNSW</text>
      <text x="170" y="205">RRF</text>
      <text x="290" y="205">RAG</text>
    </g>

    <rect x="0.5" y="0.5" width="1279" height="399" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  </g>
</svg>
